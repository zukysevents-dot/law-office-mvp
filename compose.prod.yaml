# Production compose for a single VPS: app (Next.js) behind nginx on the HOST
# (TLS via certbot / Let's Encrypt), plus a small cron sidecar that replaces the
# two Vercel cron jobs. The app port is published on 127.0.0.1 only — the
# internet reaches it exclusively through nginx.
#
# Named compose.prod.yaml (NOT the default compose.yaml) so it doesn't collide
# with the local-dev docker-compose.yml. deploy/setup-vps.sh writes
# COMPOSE_FILE / COMPOSE_PROFILES into .env, so on the server a plain
# `docker compose <cmd>` picks the right file and profile.
#
# Postgres is OPTIONAL and gated behind the `local-db` profile:
#   - Self-hosted Postgres on the VPS (default of setup-vps.sh):
#       COMPOSE_PROFILES=local-db, DATABASE_URL -> postgres:5432
#   - Managed DB (e.g. Supabase): leave the profile off, point DATABASE_URL at it.
#
# All secrets/config come from ./.env (never committed). See deploy/DEPLOY.md.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: law-office-mvp:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      # Loopback only — nginx on the host proxies to it.
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
        # Not started when the local-db profile is off (managed DB).
        required: false
    healthcheck:
      # Next serves the /login route once ready (a logged-out user is redirected
      # there). status < 400 => healthy.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  cron:
    build:
      context: ./deploy/cron
      dockerfile: Dockerfile
    image: law-office-mvp-cron:latest
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env

  postgres:
    image: postgres:17
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Empty by default so the Supabase path (no local Postgres) parses fine.
      # When you actually run --profile local-db, set POSTGRES_PASSWORD in .env —
      # the postgres image refuses to start with an empty password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-law_office_mvp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-law_office_mvp}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
