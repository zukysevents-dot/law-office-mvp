# nginx site for the app (installed by deploy/setup-vps.sh into
# /etc/nginx/sites-available/law-office, with __DOMAIN__ replaced).
#
# Starts as plain HTTP on :80. `certbot --nginx --redirect` then adds the :443
# server with the Let's Encrypt certificate and the HTTP→HTTPS redirect into
# this same file; renewal runs from certbot's systemd timer.

# Login brute-force brake: 10 req/min per IP on auth POSTs (bursts allowed).
limit_req_zone $binary_remote_addr zone=law_office_auth:10m rate=10r/m;

upstream law_office_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Server Actions accept up to 5 MB (SharePoint upload ≤ 4 MB + overhead).
    client_max_body_size 6m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Server Actions compare Origin with the forwarded host — keep them intact.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    # App Router streams responses (Suspense) — don't buffer them.
    proxy_buffering off;

    # Internal cron endpoints are called by the cron container directly, never
    # from the internet.
    location /api/internal/ {
        return 404;
    }

    location ~ ^/(login|register|portal/login) {
        limit_req zone=law_office_auth burst=20 nodelay;
        proxy_pass http://law_office_app;
    }

    location /_next/static/ {
        proxy_pass http://law_office_app;
        expires 1y;
        access_log off;
    }

    location / {
        proxy_pass http://law_office_app;
    }
}
